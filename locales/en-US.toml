"cli.clashctl_boundary" = "Run shell-init once for parent-shell on/off and clash* aliases. Uses CQS_CLASH_* data, not CLASHCTL_HOME. Subscription changes require stop/start; TUN/settings/upgrades require a stopped kernel. Conversion, delay tests, interactive selectors, Mixin editing and upstream script updates are not implemented. Secret output is redacted; import secrets with --file."
