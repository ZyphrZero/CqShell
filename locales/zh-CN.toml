"description.system.mirror.test" = "在本机从四个 HTTPS 镜像站各下载 1 MiB 仓库索引样本，每站最多 8 秒。按包含建连时间的实际下载速度排名，并显示失败原因。不修改软件源；短时采样结果不保证持续带宽。"
