"confirm.mirror" = "将按 LinuxMirrors 默认模板重建以下系统主源（包括组件设置和默认禁用源码仓库）。保留独立第三方源文件，安全更新使用官方 HTTPS 仓库。CqShell 会备份并在失败时恢复，不升级软件。\n{detail}"
