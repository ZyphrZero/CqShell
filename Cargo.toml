[package]
name = "cqs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A bilingual Rust terminal toolbox for Debian and Ubuntu"
license-file = "LICENSE"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "string"] }
crossterm = "0.29"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "disk"] }
tar = "0.4"
tempfile = "3"
toml = "0.9"
url = "2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
